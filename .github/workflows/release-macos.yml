name: Build macOS release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Target release tag (for example v2.8.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-macos:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Choose release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -z "$tag" ]; then
            echo "Unable to determine release tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/riftops-ui/frontend/package-lock.json

      - name: Install Fyne packaging CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.2

      - name: Build signed-identity-free macOS ZIP
        run: bash ./scripts/build-macos.sh "${{ steps.release.outputs.version }}" "${{ github.run_number }}"

      - name: Preserve macOS ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftOps-macOS-${{ steps.release.outputs.tag }}
          path: |
            dist/RiftOps-macOS.zip
            dist/RiftOps-macOS.zip.sha256
          if-no-files-found: error

      - name: Attach macOS ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$tag" --title "RiftOps $tag" --generate-notes --repo "${{ github.repository }}" || true
          gh release upload "$tag" dist/RiftOps-macOS.zip dist/RiftOps-macOS.zip.sha256 --clobber --repo "${{ github.repository }}"
