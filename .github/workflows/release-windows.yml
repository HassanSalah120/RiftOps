name: Build Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive the Windows executable (for example v2.6.1)
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Choose release tag
        id: release
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || inputs.tag }}"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/riftops-ui/frontend/package-lock.json

      - name: Install MinGW and Windows resource tool
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          go install github.com/tc-hib/go-winres@v0.3.3

      - name: Build and verify Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "${{ steps.release.outputs.version }}" -Build ${{ github.run_number }}

      - name: Preserve unsigned executable
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: RiftOps-Windows-${{ steps.release.outputs.tag }}-unsigned
          path: dist/RiftOps-${{ steps.release.outputs.version }}-win-x64.exe
          if-no-files-found: error

      - name: Check SignPath configuration
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "SignPath is not configured. Add the SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, and SIGNPATH_SIGNING_POLICY_SLUG repository variables."
          }

      - name: Sign Windows executable with SignPath Foundation
        if: vars.SIGNPATH_ENABLED == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows

      - name: Verify SignPath signature and refresh checksum
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem -LiteralPath "signed-windows" -Filter "*.exe" -Recurse -File)
          if ($signed.Count -ne 1) {
            throw "Expected exactly one signed Windows executable from SignPath, found $($signed.Count)."
          }
          $target = Join-Path $PWD "dist/RiftOps-${{ steps.release.outputs.version }}-win-x64.exe"
          Copy-Item -Force -LiteralPath $signed[0].FullName -Destination $target
          ./scripts/verify-windows-signature.ps1 -Path $target -ExpectedPublisher "SignPath Foundation"
          if ('${{ steps.signpath.outputs.signing-request-web-url }}' -ne '') {
            Write-Host "SignPath request: ${{ steps.signpath.outputs.signing-request-web-url }}"
          }

      - name: Preserve Windows release files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftOps-Windows-${{ steps.release.outputs.tag }}
          path: |
            dist/RiftOps-*-win-x64*.exe
            dist/RiftOps-*-win-x64*.exe.sha256
          if-no-files-found: error

      - name: Attach Windows files to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [string[]]$assets = Get-ChildItem -Path "dist/RiftOps-*-win-x64*.exe", "dist/RiftOps-*-win-x64*.exe.sha256" | ForEach-Object FullName
          if ($assets.Count -eq 0) { throw "No Windows release assets were produced." }
          gh release upload "${{ steps.release.outputs.tag }}" @assets --clobber --repo "${{ github.repository }}"
