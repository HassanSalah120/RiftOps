name: Build Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive the Windows executable (for example v2.6.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Choose release tag
        id: release
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || inputs.tag }}"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/riftops-ui/frontend/package-lock.json

      - name: Install MinGW and Fyne packaging CLI
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          go install fyne.io/tools/cmd/fyne@v1.7.2

      - name: Build and verify Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "${{ steps.release.outputs.version }}" -Build ${{ github.run_number }}

      - name: Sign Windows executable (Kingof30)
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw "Windows release signing is not configured. Add WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD GitHub Secrets for the Kingof30 certificate before publishing."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "riftops-kingof30-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            ./scripts/sign-windows.ps1 -Path "dist/RiftOps-${{ steps.release.outputs.version }}-win-x64.exe" -CertificatePath $pfxPath -CertificatePassword $env:WINDOWS_SIGNING_PFX_PASSWORD -ExpectedPublisher "Kingof30"
          }
          finally {
            Remove-Item -Force -LiteralPath $pfxPath -ErrorAction SilentlyContinue
          }

      - name: Preserve Windows release files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftOps-Windows-${{ steps.release.outputs.tag }}
          path: |
            dist/RiftOps-*-win-x64*.exe
            dist/RiftOps-*-win-x64*.exe.sha256
          if-no-files-found: error

      - name: Attach Windows files to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [string[]]$assets = Get-ChildItem -Path "dist/RiftOps-*-win-x64*.exe", "dist/RiftOps-*-win-x64*.exe.sha256" | ForEach-Object FullName
          if ($assets.Count -eq 0) { throw "No Windows release assets were produced." }
          gh release upload "${{ steps.release.outputs.tag }}" @assets --clobber --repo "${{ github.repository }}"
