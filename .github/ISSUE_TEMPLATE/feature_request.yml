name: Feature Request
description: Propose a new capability or improvement for RiftOps
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature ideas! RiftOps operates strictly under a **100% Ban-Safe** policy (zero process memory manipulation, zero DirectX hooking, official local LCU APIs only).
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I find it tedious when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you have evaluated.
  - type: dropdown
    id: deck
    attributes:
      label: Target Deck / Area
      description: Which area of RiftOps would this feature belong to?
      options:
        - Command Center
        - Cosmetic Vault (Skins)
        - Loot Workshop (Crafting)
        - Profile Studio
        - Match Telemetry & Spectator
        - Social & Friends Center
        - Queue & Grind Automation
        - Arena / Mode Specialist
        - Phone Companion
        - Settings & Security
        - Other / New Deck
