name: Bug Report
description: Report an issue or unexpected behavior in RiftOps
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you are running the latest version of RiftOps before submitting.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running RiftOps on?
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - macOS (Apple Silicon M-series)
        - macOS (Intel 64-bit)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RiftOps Version
      description: The version of RiftOps shown in Settings or window header (e.g. v2.8.3)
      placeholder: v2.8.3
    validations:
      required: true
  - type: dropdown
    id: installation-type
    attributes:
      label: Installation Type
      options:
        - Windows Setup Installer (.exe)
        - Windows Standalone Portable (.exe)
        - macOS Universal Application (.zip)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to recreate the issue.
      placeholder: |
        1. Launch RiftOps
        2. Open League Client
        3. Navigate to Deck...
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs / Screenshots
      description: Paste any error messages or attach screenshots (please ensure summoner names and personal info are masked or streamer mode is enabled).
