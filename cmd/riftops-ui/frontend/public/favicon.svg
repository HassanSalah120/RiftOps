<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0a0a11"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9147ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b377ff"/>
      <stop offset="100%" stop-color="#9147ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#9147ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Shield background -->
  <path d="M256 32 L448 96 L448 240 C448 360 350 440 256 472 C162 440 64 360 64 240 L64 96 Z" 
        fill="url(#bg)" stroke="url(#glow)" stroke-width="8" filter="url(#shadow)"/>
  <!-- Inner shield highlight -->
  <path d="M256 56 L424 114 L424 240 C424 348 338 420 256 448 C174 420 88 348 88 240 L88 114 Z" 
        fill="none" stroke="rgba(145,71,255,0.15)" stroke-width="2"/>
  <!-- Lightning bolt "R" -->
  <g transform="translate(256,256)">
    <!-- Lightning bolt left -->
    <path d="M-20,-80 L-60,10 L-10,10 L-40,80 L70,-10 L20,-10 L50,-80 Z" 
          fill="url(#accent)" filter="url(#shadow)"/>
    <!-- Lightning bolt right (reflection) -->
    <path d="M10,-60 L-15,5 L15,5 L-8,55 L45,-5 L20,-5 L35,-55 Z" 
          fill="white" opacity="0.3"/>
  </g>
  <!-- Orbital ring -->
  <ellipse cx="256" cy="256" rx="180" ry="180" fill="none" 
           stroke="rgba(145,71,255,0.08)" stroke-width="1"
           stroke-dasharray="8 12" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="140" ry="140" fill="none" 
           stroke="rgba(145,71,255,0.05)" stroke-width="1"
           stroke-dasharray="4 8" transform="rotate(45 256 256)"/>
</svg>